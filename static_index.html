<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enterprise Knowledge Assistant</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161925;
    --panel-2: #1e2230;
    --border: #2a2f42;
    --text: #e8e9f0;
    --muted: #8b8fa3;
    --accent: #6c5ce7;
    --accent-2: #4a3fd1;
    --user-bubble: #6c5ce7;
    --bot-bubble: #1e2230;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at top left, #1a1d2b, #0f1117 60%);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 820px;
    padding: 28px 20px 16px;
    text-align: center;
  }

  .logo {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #a29bfe);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 10px;
    box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
  }

  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
  }

  #chat-container {
    flex: 1;
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    padding: 0 20px;
    overflow: hidden;
  }

  #chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 10px 4px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #chat-box::-webkit-scrollbar { width: 6px; }
  #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 380px;
  }

  .empty-state .icon {
    font-size: 34px;
    margin-bottom: 10px;
    opacity: 0.7;
  }

  .empty-state h3 {
    color: var(--text);
    font-size: 16px;
    margin: 0 0 6px;
  }

  .empty-state p {
    font-size: 13px;
    line-height: 1.5;
    margin: 0;
  }

  .row {
    display: flex;
    animation: fadeIn 0.25s ease;
  }

  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .row.user .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border-bottom-right-radius: 4px;
  }

  .row.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--muted);
  }

  .sources .label {
    font-weight: 600;
    color: #a29bfe;
    margin-right: 4px;
  }

  .tag {
    display: inline-block;
    background: rgba(108, 92, 231, 0.12);
    border: 1px solid rgba(108, 92, 231, 0.3);
    color: #b9b3ff;
    padding: 2px 8px;
    border-radius: 20px;
    margin: 3px 4px 0 0;
    font-size: 11px;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
  }

  .typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  #input-bar {
    width: 100%;
    max-width: 820px;
    padding: 16px 20px 26px;
  }

  #input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  #question-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14.5px;
    padding: 10px 0;
  }

  #question-input::placeholder { color: var(--muted); }

  #send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    transition: transform 0.15s ease, opacity 0.15s ease;
    flex-shrink: 0;
  }

  #send-btn:hover { transform: scale(1.06); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .footnote {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🏢</div>
  <h1>Enterprise Knowledge Assistant</h1>
  <p>Ask anything about company policy — grounded answers, with sources.</p>
</header>

<div id="chat-container">
  <div id="chat-box">
    <div class="empty-state" id="empty-state">
      <div class="icon">💬</div>
      <h3>Start a conversation</h3>
      <p>Try asking "What is the HIPAA policy?" or "Who is the CEO?"</p>
    </div>
  </div>
</div>

<div id="input-bar">
  <div id="input-wrap">
    <input type="text" id="question-input" placeholder="Ask a question about company policy..." autocomplete="off" />
    <button id="send-btn" onclick="askQuestion()">➤</button>
  </div>
  <div class="footnote">Enterprise RAG Assistant · Answers are generated from internal documents</div>
</div>

<script>
  const API_KEY = "my-secret-key-123";
  const chatBox = document.getElementById("chat-box");
  const input = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");
  const emptyState = document.getElementById("empty-state");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.innerText = str;
    return div.innerHTML;
  }

  function addUserMessage(text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement("div");
    row.className = "row user";
    row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "typing-row";
    row.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const el = document.getElementById("typing-row");
    if (el) el.remove();
  }

  function addBotMessage(answer, sources) {
    const row = document.createElement("div");
    row.className = "row bot";
    let sourcesHtml = "";
    if (sources && sources.length > 0) {
      const unique = [...new Set(sources)];
      sourcesHtml = `<div class="sources"><span class="label">Sources</span>${unique.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join("")}</div>`;
    }
    row.innerHTML = `<div class="bubble">${escapeHtml(answer)}${sourcesHtml}</div>`;
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function askQuestion() {
    const question = input.value.trim();
    if (!question) return;

    addUserMessage(question);
    input.value = "";
    sendBtn.disabled = true;
    addTypingIndicator();

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": API_KEY
        },
        body: JSON.stringify({ question: question })
      });
      const data = await response.json();
      removeTypingIndicator();
      addBotMessage(data.answer || "No response received.", data.sources);
    } catch (error) {
      removeTypingIndicator();
      addBotMessage("⚠️ Error: Could not reach the server. Please try again.", []);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  input.addEventListener("keypress", function (e) {
    if (e.key === "Enter") askQuestion();
  });

  input.focus();
</script>

</body>
</html>
